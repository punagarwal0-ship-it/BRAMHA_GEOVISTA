# ==============================================================================
# GEOVISTA Intelligence — Sample Project Configuration
# ==============================================================================

project_name: geovista-sundarbans-analysis
version: "1.0"

aoi:
  bbox: [88.5, 21.5, 89.8, 22.5]   # [west, south, east, north] in WGS-84
  buffer_km: 0.0

dates:
  start: "2023-01-01"
  end: "2023-12-31"

sensors:
  optical:
    - sentinel2
    - landsat8
    - modis_mod13q1
  sar:
    - sentinel1
  auxiliary:
    - esa_worldcover

tasks:
  - name: vegetation_monitoring
    type: vegetation
    enabled: true
    models:
      - rf
      - lstm
    params:
      indicator: ndvi
      forecast_horizon: 6

  - name: landcover_mapping
    type: lulc
    enabled: true
    models:
      - unet
    params:
      reference_dataset: esa_worldcover_2021

compute:
  device: auto
  batch_size: auto
  num_workers: auto
  mixed_precision: auto

output:
  base_dir: artifacts
  formats:
    - geotiff
    - json
  crs: "EPSG:4326"
  overwrite: true
